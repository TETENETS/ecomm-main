version: '3.8'

services:
  ecommerce-app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - N8N_WEBHOOK_WHATSAPP=${N8N_WEBHOOK_WHATSAPP}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - PORT=3001
    volumes:
      - ecommerce_uploads:/app/uploads

volumes:
  ecommerce_uploads:
