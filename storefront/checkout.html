<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Checkout - Storefront</title>
    <link rel="icon" href="img/core-img/favicon.ico">
    <link rel="stylesheet" href="css/core-style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #contenedor-mapa { position: relative; width: 100%; height: 300px; border-radius: 10px; overflow: hidden; border: 1px solid #ccc; }

        #puntero-central { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -100%); z-index: 1000; pointer-events: none; }
        .mapa-bloqueado #puntero-central { opacity: 0.5; }
    </style>
</head>

    <div id="app"></div>

    <script src="js/jquery/jquery-2.2.4.min.js"></script>

    <script type="module" src="js/checkout.js"></script>
</body>
</html>
