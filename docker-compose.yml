services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecomm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomm_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecomm_db}
    volumes:
      - postgres_data_2:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-ecomm_user}:${POSTGRES_PASSWORD:-ecomm_password}@db:5432/${POSTGRES_DB:-ecomm_db}?schema=public}
      - PORT=3001
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    labels:
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-Requested-With,Accept,Origin"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolalloworiginlist=${CORS_ORIGIN:-*}"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolmaxage=3600"
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3001"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"

volumes:
  postgres_data_2:
  uploads_data:
