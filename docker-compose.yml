services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecomm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomm_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecomm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ecomm_user}:${POSTGRES_PASSWORD:-ecomm_password}@db:5432/${POSTGRES_DB:-ecomm_db}?schema=public
      - PORT=3001
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
    expose:
      - "3001"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001/api}
    restart: always
    expose:
      - "80"

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:3001}
    restart: always
    expose:
      - "80"

volumes:
  postgres_data:
